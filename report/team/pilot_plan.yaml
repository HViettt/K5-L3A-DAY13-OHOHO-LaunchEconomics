#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; 1.251 × 2,48 = 3.103 yêu cầu mỗi nhóm, cần 42 nhân viên mỗi nhóm, tổng 84 > 40 nên không đủ.
#   c) 20 nhân viên mỗi nhóm: tối đa 20 / 0,02 = 1.000 yêu cầu < 1.251, không đủ cho mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 yêu cầu, không đủ cho mức chênh 5 điểm.
#   e) Mức chênh 6 điểm: cần 859 yêu cầu mỗi nhóm; với 20 nhân viên mỗi nhóm, m ≥ 299 yêu cầu/người, DE = 6,96 và cỡ mẫu hiệu dụng ≈ 859.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia theo nhân viên, 20 + 20 cụm:
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần và cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày bắt đầu; ngày quyết định 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 20 + 20 nhân viên không đủ cho MDE 5 điểm, nên kế hoạch dùng MDE 6 điểm. Nếu tác động thật chỉ 5 điểm, power ở n = 859 giảm còn 0,64 và cần Giám đốc vận hành ký nhận đánh đổi này.
